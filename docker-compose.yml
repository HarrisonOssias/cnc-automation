x-agent: &agent
  build: { context: ., target: agent }
  environment: &agent-env
    BACKEND_URL: http://backend:8000
    MQTT_HOST: rabbitmq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "forge"]
      interval: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management
    # Enable MQTT on top of the stock image.
    command: ["bash", "-c", "rabbitmq-plugins enable --offline rabbitmq_mqtt && exec docker-entrypoint.sh rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: forge
      RABBITMQ_DEFAULT_PASS: forge
    ports:
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  # S3-compatible object storage for part files (STEP, PDF, images). Swap for AWS S3 in production.
  # (MinIO no longer publishes images on Docker Hub; Bitnami's archived build is the easiest to pull.)
  minio:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: forge
      MINIO_ROOT_PASSWORD: forge-secret
      MINIO_SITE_REGION: ca-central-1
      MINIO_BROWSER: "on" # the Bitnami image turns the web console off by default
    ports:
      - "9000:9000" # S3 API (signed download links point here)
      - "9001:9001" # MinIO console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30

  backend:
    build: { context: ., target: backend }
    environment:
      DATABASE_URL: postgresql+psycopg://forge:forge@postgres:5432/forge
      MQTT_HOST: rabbitmq
      RELEASES_DIR: /releases
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: ca-central-1
      S3_ACCESS_KEY: forge
      S3_SECRET_KEY: forge-secret
    ports:
      - "8000:8000"
    volumes:
      - ./releases:/releases:ro # Pi OTA releases from source/edge/build-release.sh
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }

  # Reads the machine-event stream in RabbitMQ into Postgres (the office's activity feed).
  # A separate consumer, to show that streams fan out: more consumers can read the same events.
  telemetry:
    build: { context: ., target: backend }
    command: ["python", "-m", "backend.telemetry"]
    environment:
      DATABASE_URL: postgresql+psycopg://forge:forge@postgres:5432/forge
      AMQP_URL: amqp://forge:forge@rabbitmq:5672/%2F
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # The office web app (stand-in for Forge's web system): upload parts, queue jobs. Its own server.
  web:
    build: { context: ., target: web }
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Simulated Raspberry Pis, one per machine, each with its own kiosk, SQLite volume, MQTT client and token.
  # Machines and tokens are seeded in source/cloud/backend/db.py (MACHINES). To add one: add it there,
  # copy a block below with a new id, token, port and volume, then `docker compose up -d`.
  agent: # kiosk: http://localhost:8080
    <<: *agent
    environment:
      <<: *agent-env
      MACHINE_ID: haas-vf2-01
      MACHINE_TOKEN: dev-token
    ports: ["8080:8080"]
    volumes: ["agent-data:/data"]

  agent-2: # kiosk: http://localhost:8081
    <<: *agent
    environment:
      <<: *agent-env
      MACHINE_ID: haas-vf2-02
      HAAS_STUB_TABLE: "[37,27,-1,77,17,312,120,130,-1,99,327,350,-1,150,321,325,366,58,295,-1,-1,-1,100,159,15,16,108,18,19,20,90]" # first start only; core tools in place
      MACHINE_TOKEN: dev-token-2
    ports: ["8081:8080"]
    volumes: ["agent-2-data:/data"]

  agent-3: # kiosk: http://localhost:8082
    <<: *agent
    environment:
      <<: *agent-env
      MACHINE_ID: haas-vf4-01
      HAAS_STUB_TABLE: "[37,27,-1,77,108,312,120,130,-1,99,327,18,-1,150,321,325,-1,58,295,-1,-1,-1,100,159,15,16,17,350,19,20,90]" # first start only; core tools in place
      MACHINE_TOKEN: dev-token-3
    ports: ["8082:8080"]
    volumes: ["agent-3-data:/data"]

volumes:
  pgdata:
  agent-data:
  agent-2-data:
  agent-3-data:
  minio-data:
