<!doctype html>
<!-- Chromium opens this first. It waits for the agent, then loads the kiosk. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Starting</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; font: 24px system-ui, sans-serif; color: #555; }
    </style>
  </head>
  <body>
    Starting machine agent…
    <script>
      const AGENT = "http://localhost:8080";
      (async function poll() {
        try {
          // A file:// page can't read the response (CORS), but the fetch only resolves once the agent answers.
          await fetch(`${AGENT}/healthz`, { cache: "no-store", mode: "no-cors" });
          return location.replace(`${AGENT}/`);
        } catch {}
        setTimeout(poll, 1000);
      })();
    </script>
  </body>
</html>
