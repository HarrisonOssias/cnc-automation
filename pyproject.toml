[project]
name = "forge-haas-talker"
version = "0.1.0"
description = "HAAS tool tracking: shared page logic, backend, and Pi agent"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "paho-mqtt>=2.1",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "pika>=1.3",
    # STEP -> preview picture
    "cascadio>=0.0.13",
    "trimesh>=4.4",
    "matplotlib>=3.9",
    "numpy>=1.26",
]
agent = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "paho-mqtt>=2.1",
    "sdnotify>=0.3",
]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Import names stay short (forge_core, backend, agent); the code lives under source/.
[tool.setuptools]
packages = ["forge_core", "backend", "agent"]

[tool.setuptools.package-data]
backend = ["*.sql"]  # notify.sql: the LISTEN/NOTIFY triggers

[tool.setuptools.package-dir]
forge_core = "source/shared/forge_core"
backend = "source/cloud/backend"
agent = "source/edge/agent"

[tool.pytest.ini_options]
testpaths = ["source/shared/tests", "source/edge/tests", "source/cloud/tests"]
